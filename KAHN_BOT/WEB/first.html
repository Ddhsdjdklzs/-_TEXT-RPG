<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>AI 그림 생성기</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>AI 그림 생성기</h1>
    <div id="canvas-container"></div>
    <div id="feature-container">
      <h2>특징</h2>
      <label>
        <input type="checkbox" name="feature" value="line">
        선 그리기
      </label>
      <label>
        <input type="checkbox" name="feature" value="circle">
        원 그리기
      </label>
      <label>
        <input type="checkbox" name="feature" value="rectangle">
        사각형 그리기
      </label>
    </div>
    <script src="script.js"></script>
    <style>
        body {
          font-family: Arial, sans-serif;
          text-align: center;
        }
        
        h1 {
          margin-top: 50px;
        }
        
        #canvas-container {
          margin-top: 50px;
          width: 100%;
          height: 500px;
          border: 2px solid #ccc;
          border-radius: 10px;
          overflow: hidden;
        }
        
        canvas {
          display: block;
          margin: 0 auto;
        }
        
        #feature-container {
          margin-top: 50px;
          text-align: left;
        }
        
        #feature-container h2 {
          margin-bottom: 20px;
        }
        
        #feature-container label {
          display: block;
          margin-bottom: 10px;
        }
    </style>
    <script>
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const featureContainer = document.getElementById('feature-container');
        const lineCheckbox = document.querySelector('input[name="feature"][value="line"]');
        const circleCheckbox = document.querySelector('input[name="feature"][value="circle"]');
        const rectangleCheckbox = document.querySelector('input[name="feature"][value="rectangle"]');
        
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;
        container.appendChild(canvas);
        
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        function drawLine(x1, y1, x2, y2) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
        
        function drawCircle(x, y, radius) {
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, 2 * Math.PI);
          ctx.stroke();
        }
        
        function drawRectangle(x, y, width, height) {
          ctx.beginPath();
          ctx.rect(x, y, width, height);
          ctx.stroke();
        }
        
        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (lineCheckbox.checked) {
            drawLine(0, 0, canvas.width, canvas.height);
          }
          if (circleCheckbox.checked) {
            drawCircle(canvas.width / 2, canvas.height / 2, 50);
          }
          if (rectangleCheckbox.checked) {
            drawRectangle(50, 50, 100, 100);
          }
        }
        
        canvas.addEventListener('mousedown', (e) => {
          isDrawing = true;
          lastX = e.offsetX;
          lastY = e.offsetY;
        });
        
        canvas.addEventListener('mousemove', (e) => {
          if (isDrawing) {
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            lastX = e.offsetX;
            lastY = e.offsetY;
          }
        });
        
        canvas.addEventListener('mouseup', () => {
          isDrawing = false;
        });
        
        lineCheckbox.addEventListener('change', draw);
        circleCheckbox.addEventListener('change', draw);
        rectangleCheckbox.addEventListener('change', draw);
    </script>
  </body>
</html>
